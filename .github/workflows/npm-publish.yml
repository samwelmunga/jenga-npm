# Generated by /publish npm-ci pipeline — do not edit manually
name: "Publish — @jenga-ai/agent"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "publish (default) or stage — dispatched by npm_stage_pipeline.sh with mode=stage for /publish stage"
        required: false
        default: publish
        type: choice
        options:
          - publish
          - stage

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    if: ${{ github.event.inputs.mode == 'publish' || github.event.inputs.mode == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish --provenance --access public --tag latest

      - name: Tag prod release and remove stage tag
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="$(node -p "require('./package.json').version")"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          git tag -d "v${VERSION}-stage" 2>/dev/null || true
          git push origin ":refs/tags/v${VERSION}-stage" 2>/dev/null || true

  stage:
    if: ${{ github.event.inputs.mode == 'stage' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Stage to npm
        run: npm stage publish --provenance --access public --tag latest

      - name: Tag stage release
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="$(node -p "require('./package.json').version")"
          git tag -f "v${VERSION}-stage"
          git push origin "v${VERSION}-stage" --force
