# ---------------------------------------------------------------------------
# scripts/never-public-exemptions.conf   (E28_S21_T03)
#
# The declared list of files allowed to carry a PATH reference to a blocked
# skill, read by the one shared rule (scripts/never-public-refs.sh) and so by
# all three consumers: check 6 of the catalog smoke test, the mirror guard, and
# scripts/check-public-references.sh. The rule and the format are specified in
# project/documentation/public-mirror-content-parity.md.
#
# THIS FILE IS A SECURITY-RELEVANT ALLOW LIST. Adding an entry makes the push
# gate stop refusing a line it would otherwise refuse. Review every entry and
# its reason, not only the diff.
#
# FORMAT (line based, no other syntax is accepted)
#   [path/from/repo/root]    one entry per file; a leading dot-claude or dot-agents
#                            prefix is NOT written: the key is the root path, and
#                            both generated mirror copies of the file are covered
#   reason = <text>          MANDATORY, one line, self-contained: a reader sees
#                            only this file
#   match = <text>           optional literal substring; only a hit on a line that
#                            contains it is exempt (no pattern language)
#   # comment, or blank line
# A missing reason, an empty match, a duplicate entry or field, a directory or
# glob key, an unknown field, or any other line makes the file malformed, and
# every consumer then refuses to run (fail closed), naming the entry.
#
# WHAT AN ENTRY DOES NOT DO
#   - It exempts PATH hits only. A line that also names a blocked skill by name
#     (a slash command or dotted invocation) stays reported.
#   - It never applies to the router MCP directory audited by
#     scripts/check-public-references.sh as private tooling.
#   - No directories, no globs, no per-line entries.
#
# THE BAR FOR AN ENTRY
#   Naming the path is the file's PURPOSE (a registry of paths that really
#   shipped, a tool that rewrites those paths, a permission rule for a
#   maintainer-only command). A reference a consumer would follow to a path that
#   does not exist is a defect to reword, never an entry.
#
# This file must add no path hit of its own. The reasons and match texts below
# therefore refer to a blocked skill's directory in words, never as a path.
# ---------------------------------------------------------------------------

[lib/legacy-shipped-paths.json]
reason = Generated registry of paths that shipped in real earlier npm versions, read by the postinstall step to seed delete reconciliation; the path strings are the data and rewriting them would break the registry. It is regenerated by scripts/generate-legacy-shipped-paths.js, so line numbers are unstable and only a whole-file key survives regeneration (28 path hits at the time of writing).

[scripts/compute-deploy-reconcile.sh]
reason = Reads the public-mirror skill's own config file, which is a deliberately maintainer-only input: the script discovers deploy tags for the private repository, and in a consumer install the file is absent and the script reports it. Narrowed to the one line that names the config file, so a second reference to a blocked skill elsewhere in the script is still reported.
match = /assets/config.json

[scripts/repoint-dead-bare-path-prose.py]
reason = Spent one-shot migration tool from E50_S22_T03 with no live caller; the paths it names are the targets it rewrites, so they are its data. Exempted rather than retired because deleting a shipped file is a separate decision for the maintainer; if the tool is retired this entry goes with it.

[scripts/rewrite-stale-skill-preambles.py]
reason = Spent one-shot migration tool from E50_S22_T02 with no live caller; the paths it names are the files it edits and the text it writes, so they are its data. Exempted rather than retired because deleting a shipped file is a separate decision for the maintainer; if the tool is retired this entry goes with it.

[templates/permission-levels/level-4-elevated.json]
reason = A permissions allow rule for the public-mirror skill's script. It is functional for the maintainer, which is why level 4 exists for them, and inert in a consumer install because it allows a command that does not exist there. Narrowed to the allow rule itself, so any other reference in this template is still reported.
match = /scripts/mirror.sh*)

[templates/permission-levels/level-5-unrestricted.json]
reason = A permissions allow rule for the public-mirror skill's script, identical to the level 4 template: functional for the maintainer, inert in a consumer install because it allows a command that does not exist there. Narrowed to the allow rule itself, so any other reference in this template is still reported.
match = /scripts/mirror.sh*)
