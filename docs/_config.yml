# Jekyll config for Jenga AI's GitHub Pages documentation site (E41_S13).
#
# SOURCE OF TRUTH (E41_S13_T01 decision): this site is RESTRUCTURED FROM
# project/.wiki/documentation.md + project/.wiki/intro-guide.md +
# project/.wiki/concepts/*.md, which remain the canonical, doc-sync-maintained
# wiki mirror and stay in sync going forward. This site does NOT supersede
# the wiki — it is a navigable, styled presentation layer over the same
# content, reorganized into multiple linked pages instead of one long
# scrollable file. See docs/README.md for the full decision record.
#
# TOOLING (E41_S13_T01 decision): GitHub's built-in Jekyll support, served
# from this docs/ folder on the main branch. No Gemfile, no gh-pages branch,
# no custom CI build pipeline — GitHub builds this automatically on push.
#
# Theme: minima — Jekyll's own default theme, natively supported by GitHub
# Pages (https://pages.github.com/themes/ lists the pages-themes/* gems;
# minima is supported the same native way, just not through that gem family).
# Chosen over a pages-themes/* theme like Cayman because minima's default
# layout actually renders a header nav bar sourced from `header_pages` below
# — Cayman (and most pages-themes/* themes) ship with no navigation bar at
# all, which would have left the "genuinely navigable, multiple linked pages"
# requirement unmet without hand-writing a custom layout/include. Verified
# via GitHub search of jekyll/minima's own docs before choosing this over the
# originally-drafted Cayman default.

title: Jenga AI
description: >-
  Jenga AI is a meta-framework for agentic software development — a suite of
  Claude-based AI agents, a skill library, scripting infrastructure, and a
  project board system (epics/stories/tasks) that gives consumer projects a
  structured agentic workflow.

theme: minima

# IMPORTANT: docs/ predates this Pages site — it is also this repo's
# existing home for internal/engineering reference docs (linked from
# CLAUDE.md, AGENTS.md, README.md, and many skills/*/SKILL.md files by
# their docs/<name>.md path, e.g. "See docs/skill-authoring.md"). Those
# files carry no Jekyll front matter, were never meant to be part of a
# public Pages site, and must not be moved (their paths are referenced
# throughout the repo). `exclude:` keeps Jekyll from building/publishing
# them as site pages while leaving them exactly where every other doc
# reference expects them.
exclude:
  - JENGA_PROTOCOL.md
  - STRATEGY.md
  - api-contract.md
  - distribution.md
  - hook-parity.md
  - jenga-config.md
  - skill-authoring.md

# Top-of-page navigation. Minima's default layout renders a nav link for
# each entry here — this is what keeps the site "genuinely navigable" per
# this task's AC without hand-writing a custom layout/include. index.md is
# intentionally omitted: it's the home page, already reachable via the site
# title link in the header, so minima convention is to list only the other
# pages here.
#
# skills.md, agents.md, hooks.md, and mcp-tools.md are reachable from
# reference.md's in-page index rather than listed here directly, to keep
# the header nav itself short — reference.md is in the header, and links
# to all four. This still satisfies "every skill/agent/hook reachable via
# nav or in-page links, no dead ends" (E41_S13_T02 AC).
header_pages:
  - getting-started.md
  - concepts.md
  - reference.md

# E41_S13_T02: getting-started.md, concepts.md, skills.md, agents.md,
# hooks.md, mcp-tools.md, and reference.md are all generated by
# scripts/build-pages-site.sh from project/.wiki/* — do not hand-edit those
# files directly, re-run the script instead (see its header comment for
# details, and skills/doc-sync/SKILL.md for when to re-run it). index.md
# and this file are hand-authored site structure, not script output.
